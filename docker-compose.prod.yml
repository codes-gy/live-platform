# 운영(자체 호스팅): 한 대의 PC/서버에서 DB · 백엔드 · 프론트를 띄우고 Tailscale Funnel로 HTTPS 공개한다.
# 사용법: cp .env.prod.example .env.prod (값 채우기) → scripts/self-host.sh up  (docs/DEPLOY.md)
# 영상 · 음성은 LiveKit(Cloud 또는 자체 서버)이 중계하므로 이 구성에는 미디어 포트가 필요 없다.
name: jiing

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: live
      POSTGRES_USER: live
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필요}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live -d live"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/live
      DB_USERNAME: live
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필요}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL 필요}
      TEST_ACCOUNTS_ENABLED: "true"
      TEST_ACCOUNT_PASSWORD: ${TEST_ACCOUNT_PASSWORD:-test1234!}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL 필요}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY 필요}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET 필요}
      # Heroku 512MB용 제한을 풀어 준다
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
      SERVER_TOMCAT_THREADS_MAX: "200"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
    # 이 PC에서만 열린다. 외부 공개는 Tailscale Funnel(https → 127.0.0.1:3300)이 맡는다
    ports:
      - "127.0.0.1:3300:3000"

volumes:
  pgdata:
