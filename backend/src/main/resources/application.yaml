spring:
  application:
    name: live-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/live}
    username: ${DB_USERNAME:live}
    password: ${DB_PASSWORD:live}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  autoconfigure:
    # JWT로만 인증한다. 기본 사용자(생성된 비밀번호 로그)를 만들지 않는다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  # Heroku 등은 PORT로 포트를 정해 준다
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:12h}
  cookie:
    secure: ${COOKIE_SECURE:false}
  # 로그인 무차별 대입 방지: (접속 IP, 이메일)마다 window 안에 max-failures번 틀리면 window가 끝날 때까지 429.
  # 메모리에 센다(서버 한 대 기준, 재시작하면 초기화)
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    window: ${LOGIN_WINDOW:15m}
  # 댓글 실시간 구독(SSE): 접속 IP 하나가 동시에 열 수 있는 연결 수(메모리, 서버 한 대 기준)
  comment-stream:
    max-per-ip: ${COMMENT_STREAM_MAX_PER_IP:30}
  livekit:
    url: ${LIVEKIT_URL:}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    empty-timeout: 2m
    departure-timeout: 1m
    broadcaster-grace: 30s
    # 웹훅이 유실돼 LIVE로 남은 방송을 찾는 주기(LiveReconcileScheduler)
    reconcile-interval: 1m
    token-ttl: 1h
  # 도네이션(토스페이먼츠 테스트 모드). 비어 있으면 후원 주문 · 승인 API가 503
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    # 승인 결과를 모른 채 CONFIRMING으로 남은 후원을 토스 조회로 마무리하는 주기(DonationReconcileScheduler)
    reconcile-interval: 1m
  # 녹화(LiveKit Egress → Cloudflare R2). 비어 있으면 녹화 없이 방송만 한다
  recording:
    r2-account-id: ${R2_ACCOUNT_ID:}
    r2-access-key-id: ${R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    r2-bucket: ${R2_BUCKET:}
    playback-ttl: 2h
