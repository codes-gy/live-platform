spring:
  application:
    name: live-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/live}
    username: ${DB_USERNAME:live}
    password: ${DB_PASSWORD:live}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  autoconfigure:
    # JWT로만 인증한다. 기본 사용자(생성된 비밀번호 로그)를 만들지 않는다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:12h}
  cookie:
    secure: ${COOKIE_SECURE:false}
  test-accounts:
    enabled: ${TEST_ACCOUNTS_ENABLED:true}
    password: ${TEST_ACCOUNT_PASSWORD:test1234!}
  livekit:
    url: ${LIVEKIT_URL:}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    empty-timeout: 2m
    departure-timeout: 1m
    broadcaster-grace: 30s
    token-ttl: 1h
